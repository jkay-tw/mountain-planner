<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mountain Planner v0.7 跨圖路網測試</title>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#20352b;background:#f4f7f4}
*{box-sizing:border-box}body{margin:0}.wrap{width:min(1050px,calc(100% - 28px));margin:30px auto 80px}
a{color:#276346}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(23px,4vw,34px);margin:10px 0}h2{margin:0 0 8px;font-size:20px}
.lead{color:#51685c;line-height:1.75}.panel{background:white;border:1px solid #d8e2d9;border-radius:16px;padding:24px;margin-top:20px;box-shadow:0 3px 10px #10251a0a}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px}
.field{display:grid;gap:7px;font-weight:600}select,button{font:inherit;padding:11px 12px;border-radius:9px}
select{width:100%;min-width:0;background:white;border:1px solid #abbcaf}
button{border:0;background:#275f44;color:white;cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #82ab88;outline-offset:2px}
.note{background:#fff8e6;border:1px solid #ecd99b;border-radius:12px;padding:14px 16px;line-height:1.75}
.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:630px}th,td{border-bottom:1px solid #e0e8e1;text-align:left;padding:11px 9px;vertical-align:top}th{background:#e8f0e9}#status{color:#52685b}
@media(max-width:650px){.wrap{margin:16px auto 40px}.panel{padding:16px}.controls{grid-template-columns:1fr}#swap{justify-self:start}}
</style></head><body><main class="wrap">
<header><div><small>Mountain Planner · v0.7 測試功能</small><h1>跨圖步行路網驗證</h1></div><a href="index.html">返回行程規劃器</a></header>
<p class="lead">這是獨立驗證頁面，不會讀取或修改現有行程與自動儲存。只載入南二段（G17）與新康橫斷（G18）目前已核對的部分路段。</p>
<div class="note"><strong>注意：</strong>不是完整登山路線資料庫。未核實路段一律排除；資料中的步程時間不代表現場安全、開放或通行狀態。出發前仍須查閱官方圖與最新山區資訊。</div>
<section class="panel"><h2>選擇起點與終點</h2><p id="status" aria-live="polite">正在讀取測試資料⋯</p>
<div class="controls">
<label class="field">起點<select id="start" aria-label="跨圖起點"></select></label>
<button type="button" id="swap" aria-label="交換起終點">⇄ 交換</button>
<label class="field">終點<select id="end" aria-label="跨圖終點"></select></label>
</div></section>
<section class="panel" id="result" aria-live="polite"><p>路徑計算準備中⋯</p></section>
</main><script type="module" src="js/crossmap-preview.js"></script></body></html>
