<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登山行程快速規劃器</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <p class="eyebrow">Mountain Planner</p>
        <h1>登山行程快速規劃器</h1>
        <p class="sub">選重要節點，自動補齊最短上河路徑；再依每天速度、休息與手動節點微調。</p>
      </div>
      <a class="source" href="https://www.sunriver.com.tw/step2020.htm" target="_blank" rel="noreferrer">上河來源</a>
    </header>

    <section class="card controls">
      <div class="field">
        <label for="routeSelect">上河圖群組</label>
        <select id="routeSelect"></select>
      </div>
      <div class="field compact">
        <label for="dayCount">行程天數</label>
        <select id="dayCount"></select>
      </div>
      <div class="top-actions">
        <button id="copyBtn" class="secondary">複製文字行程</button>
        <button id="exportBtn">匯出 Excel</button>
        <button id="resetBtn" class="secondary">清空</button>
      </div>
    </section>

    <div class="notice">
      <strong id="routeMeta"></strong>
      <span>目前資料仍以 checked 為主；正式行程請以官方原圖再次核對。</span>
    </div>

    <section id="daysContainer" class="days"></section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
