name: Publish Nov 12 owner review data release
on:
  push:
    branches: [main]
    paths: ['docs/SHEET_COORDINATE_REVIEW_20261112.md']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/sync_coordinate_geometry.py --check
      - name: Publish data patch while preserving latest application release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create data-coordinates-20261112 --target "$GITHUB_SHA" --title '節點座標審查與路網分類更新（2026-11-12）' --notes-file docs/SHEET_COORDINATE_REVIEW_20261112.md --latest=false data/geometry/sources/sheet-review-20261112.json data/geometry/sources/sheet-review-application-20261112.json data/geometry/sources/sheet-review-terrain-20261112.json
