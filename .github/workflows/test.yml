name: Planner JavaScript tests
on:
  pull_request:
  push:
    branches:
      - feature/v0.6-reliability
      - feature/v0.7-node-identity
jobs:
  planner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify planner logic
        run: |
          node --check js/app.js
          node --check js/planner.js
          node --check js/node-identity.js
          node --experimental-default-type=module --test tests/*.test.mjs
