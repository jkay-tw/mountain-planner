name: Archive verified terrain build sources

on:
  workflow_dispatch:
  push:
    branches: ['data/g04-daba-coordinate-sync-20261106']
    paths: ['.github/workflows/archive-terrain-sources.yml', 'tools/archive_terrain_sources.py']

permissions:
  contents: write

concurrency:
  group: archive-terrain-sources-20261106
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install osmium==4.3.2
      - name: Recover exact upstream versions and extract network
        run: python3 tools/archive_terrain_sources.py "$RUNNER_TEMP/terrain-inputs"
      - name: Publish source assets separately from application releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view terrain-sources-20261106 >/dev/null 2>&1 || gh release create terrain-sources-20261106 --target "$GITHUB_SHA" --title 'Terrain build sources 2026-11-06' --latest=false --notes-file docs/TERRAIN_SOURCE_NOTICES.md
          gh release upload terrain-sources-20261106 "$RUNNER_TEMP/terrain-inputs/walking-network-roads.json.gz" "$RUNNER_TEMP/terrain-inputs/hgtmix.zip" "$RUNNER_TEMP/terrain-inputs/terrain-sources-manifest.json" "$RUNNER_TEMP/terrain-inputs/TERRAIN_SOURCE_NOTICES.md"
