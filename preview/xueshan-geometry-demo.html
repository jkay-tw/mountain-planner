<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="css/itinerary-map.css?v=v0727">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<style>body{font-family:system-ui,sans-serif;background:#f5f7f3;color:#253b31;margin:0}main{max-width:1050px;margin:auto;padding:20px}h1{font-size:1.5rem}button,select{font:inherit;padding:8px 12px;border:1px solid #b5c9b9;border-radius:7px;background:white;color:#254936}a{color:#246447}p{line-height:1.6}</style>
</head><body><main>
<a href="unified-editor.html?v=v0727">← 回行程編輯器</a>
<h1>雪山行程線形範例</h1>
<p>以固定範例查看去程、回程、多日及缺漏；本頁不讀寫你的行程或暫存。距離沿 OSM 候選步道計算，未經現地核實。</p>
<label for="scenario">範例行程</label> <select id="scenario"><option value="ascent">登山口 → 雪山主峰</option><option value="descent">雪山主峰 → 登山口</option><option value="days">兩日往返（三六九銜接）</option><option value="circle">三六九 → 圈谷底部（未定位端點）</option><option value="manual">七卡 → 哭坡為手動段（缺漏）</option></select>
<p id="sequence"></p>
<details id="geometry" class="geometry-panel" open></details>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script type="module">
import {createItineraryMap} from './js/itinerary-map.js?v=v0727';
const ids=['g04-045','shared:cw-v07-003','g04-027','g04-044','shared:cw-v07-004','g04-039','shared:cw-v07-074'];
const names=['雪山登山口','七卡山莊','哭坡觀景台','雪山東峰','三六九山莊','圈谷底部','雪山主峰'];
const make=indices=>({items:indices.map((n,i)=>({type:'location',name:names[n],nodeId:ids[n],incoming:i?{kind:'official',fromNodeId:ids[indices[i-1]],toNodeId:ids[n]}:null}))});
let days=[];
const view=createItineraryMap({host:document.getElementById('geometry'),getDays:()=>days});
function change(){
 const scenario=document.getElementById('scenario').value;
 days=scenario==='days'?[make([0,1,2,3,4]),make([4,5,6,5,4,3,2,1,0])]:[make(scenario==='descent'?[6,5,4,3,2,1,0]:scenario==='circle'?[4,5]:[0,1,2,3,4,5,6])];
 if(scenario==='manual')days[0].items[2].incoming.kind='manual';
 document.getElementById('sequence').textContent=days.map((d,i)=>`Day ${i+1}：`+d.items.map(x=>x.name).join(' → ')).join(' ／ ');
 view.update();
}
document.getElementById('scenario').onchange=change;change();
</script></body></html>
